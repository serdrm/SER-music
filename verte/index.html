<head>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#080808;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
    .artwork-wrap{width:100%;max-width:480px;position:relative}
    .artwork{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
    .artwork-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,#080808)}
    .info{width:100%;max-width:480px;padding:16px 20px 6px;text-align:center}
    .release-title{font-family:'Big Shoulders Display',sans-serif;font-size:36px;font-weight:900;letter-spacing:0.04em;line-height:1}
    .release-meta{font-size:12px;color:rgba(255,255,255,0.45);margin-top:6px;letter-spacing:0.18em;text-transform:uppercase}.release-meta a{color:inherit;text-decoration:underline;text-underline-offset:2px}.release-meta a:hover{color:rgba(255,255,255,0.75)}
    .platforms{width:100%;max-width:480px;padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px}
    .platform-btn{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#161616;border:1px solid rgba(255,255,255,0.09);border-radius:14px;text-decoration:none;color:#fff;transition:background .15s,border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
    .platform-btn:hover{background:#1E1E1E;border-color:rgba(255,255,255,0.2)}
    .platform-btn:active{transform:scale(0.98)}
    .platform-left{display:flex;align-items:center;gap:13px}
    .platform-icon{width:30px;height:30px;flex-shrink:0}
    .platform-name{font-size:15px;font-weight:500;letter-spacing:0.01em}
    .play-pill{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.45);background:rgba(255,255,255,0.07);padding:7px 13px;border-radius:20px;white-space:nowrap;flex-shrink:0}
    .footer{margin-top:auto;padding:16px 16px 28px;font-size:11px;color:rgba(255,255,255,0.2);letter-spacing:0.12em;text-transform:uppercase;text-align:center}
    .footer a{color:rgba(255,255,255,0.3);text-decoration:none}
    .footer a:hover{color:rgba(255,255,255,0.6)}
  </style>
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="artwork-wrap">
    <img class="artwork" src="https://i.scdn.co/image/ab67616d0000b273fb899d02165fefb9cf501f63" alt="Verte — SER" />
  </div>
  <div class="info">
    <div class="release-title">VERTE</div>
    <div class="release-meta"><a href="https://www.ser-music.com" id="ser-link">SER</a> &nbsp;·&nbsp; Single &nbsp;·&nbsp; 2024</div>
  </div>
  <div class="platforms">
    <a class="platform-btn" href="https://open.spotify.com/track/278EZRg1t3ZbEIKZYotY91" target="_blank" rel="noopener noreferrer">
      <div class="platform-left"><svg class="platform-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#1DB954"/><path d="M17.2 10.6c-3-1.8-8-2-10.9-1.1a.85.85 0 01-.5-1.6c3.3-1 8.7-.8 12.1 1.3a.85.85 0 01-.7 1.4zm-.1 2.8a.71.71 0 01-.98.22c-2.5-1.5-6.3-2-9.2-1.1a.71.71 0 01-.41-1.36c3.4-1 7.6-.5 10.5 1.25a.71.71 0 01.09.99zm-1.2 2.8a.57.57 0 01-.78.17c-2.2-1.3-4.9-1.6-8.1-.88a.57.57 0 01-.25-1.11c3.5-.8 6.6-.45 9.06.99a.57.57 0 01.08.83z" fill="white"/></svg><span class="platform-name">Spotify</span></div>
      <span class="play-pill">ESCUCHAR &#9654;</span>
    </a>
    <a class="platform-btn" href="https://music.youtube.com/playlist?list=OLAK5uy_mftag-dny-t9DpfF-6NWrAbptIrYEJi1U" target="_blank" rel="noopener noreferrer">
      <div class="platform-left"><svg class="platform-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#FF0000"/><path d="M9.5 8.2l7 3.8-7 3.8V8.2z" fill="white"/></svg><span class="platform-name">YouTube Music</span></div>
      <span class="play-pill">ESCUCHAR &#9654;</span>
    </a>
    <a class="platform-btn" href="https://music.apple.com/us/album/verte/1844728629?i=1844728630" target="_blank" rel="noopener noreferrer">
      <div class="platform-left"><svg class="platform-icon" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#FC3C44"/><path d="M16 6H10a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V8a2 2 0 00-2-2zm-3 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5zm3-6h-1V8h1v1.5z" fill="white"/></svg><span class="platform-name">Apple Music</span></div>
      <span class="play-pill">ESCUCHAR &#9654;</span>
    </a>
  </div>
  <div class="footer"><a href="https://www.ser-music.com">ser-music.com</a></div>
  <script>
    // Registra a qué plataforma le dio click el visitante
    document.querySelectorAll('.platform-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var name = btn.querySelector('.platform-name');
        window.va('event', {
          name: 'platform_click',
          data: {
            platform: name ? name.textContent.trim() : 'unknown',
            release: 'verte'
          }
        });
      });
    var serLink = document.getElementById('ser-link');
    if (serLink) serLink.addEventListener('click', function () {
      window.va('event', { name: 'site_link_click', data: { release: 'verte' } });
    });
    });
  </script>
</body>
</html>
